[project]
name = "drobe-server"
version = "0.1.0"
description = "AI pipeline for drobe: photo -> cutout + labels, and wardrobe -> outfit"
requires-python = ">=3.11,<3.14"  # upper bound comes from rembg

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
