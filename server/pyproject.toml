[project]
name = "drobe-server"
version = "0.1.0"
description = "AI pipeline for drobe: photo -> cutout + labels, and wardrobe -> outfit"
requires-python = ">=3.11,<3.14"  # upper bound comes from rembg

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are called in argument defaults by
# design; they are effectively immutable singletons, not B008 mutable defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Form"]
